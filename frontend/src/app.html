<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="TenderWise AI - Enterprise RFP & Tendering Platform" />
		<meta name="keywords" content="RFP, tendering, AI, workflow, enterprise" />
		<meta name="author" content="TenderWise AI" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="TenderWise AI - Enterprise RFP Platform" />
		<meta property="og:description" content="AI-powered RFP management and tendering platform for enterprises" />
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:title" content="TenderWise AI" />
		<meta property="twitter:description" content="AI-powered RFP management platform" />
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-950 text-white antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
